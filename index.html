<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantastic Pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">

    <!-- หน้าโหลด -->
    <section id="loading" class="screen active">
      <div class="stars"></div>
      <div class="moon"></div>
      <h1 class="title">Fantastic<br>Pet</h1>
      <div class="loader">
        <div class="bar"><div id="fill" class="fill"></div></div>
        <p id="percent" class="percent">0%</p>
      </div>
      <button id="playBtn" class="play" hidden>Play</button>
    </section>

    <!-- หน้าเกม (โล่ง 1 เฟรมโทรศัพท์) -->
    <section id="game" class="screen"></section>


  </main>
  <script src="script.js"></script>
</body>
</html>
